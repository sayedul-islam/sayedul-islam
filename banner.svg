<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Sayedul Islam, UI/UX and Graphic Designer, Frontend Developer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#1E293B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38BDF8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#94A3B8" fill-opacity="0.22"/>
    </pattern>
    <clipPath id="round"><rect width="1280" height="320" rx="20"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <!-- Background -->
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#dots)"/>
    <circle cx="1020" cy="160" r="300" fill="url(#glow)"/>

    <!-- Left: text -->
    <text x="70" y="104" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" fill="#94A3B8" letter-spacing="2">HELLO, I'M</text>
    <text x="70" y="168" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#FFFFFF">Sayedul Islam</text>
    <text x="70" y="212" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="22" font-weight="600" fill="#38BDF8">UI/UX &amp; Graphic Designer · Frontend Developer</text>
    <text x="70" y="248" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#94A3B8">Minimalist design. Pixel-perfect interfaces.</text>
    <rect x="70" y="272" width="64" height="4" rx="2" fill="#38BDF8"/>

    <!-- Right: UI card motif -->
    <rect x="880" y="60" width="280" height="200" rx="16" fill="#0F172A" fill-opacity="0.85" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1.5"/>
    <circle cx="904" cy="84" r="5" fill="#F87171"/>
    <circle cx="922" cy="84" r="5" fill="#FBBF24"/>
    <circle cx="940" cy="84" r="5" fill="#34D399"/>
    <circle cx="920" cy="132" r="18" fill="#38BDF8"/>
    <rect x="950" y="121" width="120" height="8" rx="4" fill="#FFFFFF" fill-opacity="0.85"/>
    <rect x="950" y="139" width="80" height="6" rx="3" fill="#FFFFFF" fill-opacity="0.35"/>
    <rect x="900" y="166" width="240" height="46" rx="8" fill="#38BDF8" fill-opacity="0.16"/>
    <rect x="1056" y="224" width="84" height="22" rx="11" fill="#38BDF8"/>

    <!-- Right: vector bezier curve with anchors and handles -->
    <path d="M760 250 C 830 300, 1020 30, 1230 90" fill="none" stroke="#38BDF8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="760" y1="250" x2="830" y2="300" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>
    <line x1="1230" y1="90" x2="1020" y2="30" stroke="#94A3B8" stroke-width="1.2" stroke-dasharray="4 4"/>
    <circle cx="830" cy="300" r="5" fill="#0B1120" stroke="#94A3B8" stroke-width="1.5"/>
    <circle cx="1020" cy="30" r="5" fill="#0B1120" stroke="#94A3B8" stroke-width="1.5"/>
    <rect x="753" y="243" width="14" height="14" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
    <rect x="1223" y="83" width="14" height="14" fill="#FFFFFF" stroke="#38BDF8" stroke-width="2"/>
    <circle cx="1230" cy="90" r="10" fill="none" stroke="#38BDF8" stroke-width="2">
      <animate attributeName="r" values="10;24" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0" dur="2.5s" repeatCount="indefinite"/>
    </circle>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
